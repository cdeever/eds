dependencies:
  idf: '>=6.0'

  # esp-mqtt shipped inside IDF through 5.x and moved out to the component
  # registry in 6.0, as the screen's notes.
  espressif/mqtt: ^1.1.0
  # The wake word (ADR-0043): TensorFlow Lite Micro, with Espressif's
  # vector kernels, and the audio frontend microWakeWord's models were
  # trained on, as ESPHome uses it. The frontend is not in the registry, so
  # it is taken from its repository, pinned.
  espressif/esp-tflite-micro: ^1.3.4
  esp-micro-speech-features:
    git: https://github.com/kahrendt/ESPMicroSpeechFeatures.git
    version: 351c4c69530f5a802da5433581c4863afadf0a00
