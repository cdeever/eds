[project]
name = "eds-palette"
version = "0.1.0"
description = "Extract a ranked, weighted colour palette from album cover art."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
eds-palette = "eds_palette.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eds_palette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
