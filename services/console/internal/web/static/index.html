<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>EdS</title>
  <link rel="stylesheet" href="app.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">EdS</span>
      <span class="tag">what is playing, and what the room is doing about it</span>
    </div>
    <div class="parts" id="parts" aria-label="Parts of EdS and whether they are up"></div>
  </header>

  <main>
    <section class="now" aria-labelledby="title">
      <div class="cover" id="cover">
        <img id="cover-img" alt="" hidden>
        <div class="cover-empty" id="cover-empty"></div>
      </div>
      <div class="track">
        <p class="where" id="where"></p>
        <h1 id="title">Listening…</h1>
        <p class="artist" id="artist"></p>
        <p class="album" id="album"></p>
        <div class="playhead" id="playhead" hidden>
          <span class="elapsed" id="elapsed"></span>
          <span class="bar" id="bar" role="progressbar" aria-label="Position in the track" aria-valuemin="0"><i id="bar-fill"></i></span>
          <span class="length" id="length"></span>
        </div>
        <p class="note" id="cover-note"></p>
      </div>
    </section>

    <section class="stand-sources" id="stand-sources" aria-label="Which sources light the stand">
      <span class="kind-name">Stand</span>
      <span class="word" id="stand-word">lit for records</span>
      <button type="button" id="stand-switch" hidden></button>
      <span class="fine" id="stand-note"></span>
    </section>

    <section id="stands" aria-label="Light stands"></section>

    <div class="columns">
      <section class="panel" aria-labelledby="players-h">
        <h2 id="players-h">Players</h2>
        <ul class="rows" id="sources"></ul>
      </section>
      <section class="panel" aria-labelledby="recent-h">
        <h2 id="recent-h">Recently played</h2>
        <ol class="rows" id="recent"></ol>
        <p class="fine">Since the console last started. The whole history is in the log store.</p>
      </section>
    </div>
  </main>

  <footer>
    <span class="live" id="live">connecting</span>
    <nav id="links" aria-label="Elsewhere"></nav>
    <span class="fine" id="version"></span>
  </footer>

  <noscript><p class="noscript">This page draws itself with JavaScript, and has none to run.</p></noscript>
</body>
</html>
