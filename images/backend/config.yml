---
# EdS backend Pi image: offline configuration (ADR-0033).
#
# Runs against a mounted copy of Deevnet IoTaaS's take-home image, pi-backend:
# Raspberry Pi OS with a broker, a log store, the bridge between them and
# Grafana, and deevnet-kit to manage them. The root is at chroot_root and the
# boot partition at chroot_root/boot. The image does not boot and needs no
# network of its own; apt and pip run in the chroot over the build host's.
#
# This adds the rest of EdS: palette, lightd, nowplayd and the console as
# units of their own, and the now-playing agent with its recognizer. What it
# makes is in images/README.md. The rules it holds to:
#
#   - Nothing secret is baked in. The card's CA and tokens are made by
#     deevnet-kit on first boot, and the broker accounts by eds-backend-setup
#     after it. The build fails if any is found in the image.
#   - Nothing particular to one Pi is baked in either. Its name and its Wi-Fi
#     arrive on the card's boot partition, in deevnet-kit.txt.
#   - Nothing of the base is changed. Its units, its broker's configuration
#     and its instructions are left as Deevnet IoTaaS made them; what is added
#     is added beside them. The one file replaced is /etc/nftables.conf, which
#     the base ships as the operating system left it and does not load.
#   - It is a host on one network and a router for none.
#
# The tasks for the agent are a copy of images/agent/config.yml's, and the
# agent's own files are read from images/agent/files, not copied. The two
# playbooks are to be folded together once this image is proven.
#
# Run by images/build.sh.

- name: Configure the EdS backend Pi image (offline)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    chroot_root: "{{ chroot_root | default(omit) }}"

    # Where build.sh checked the staged binaries, and what it was built from.
    # build.sh passes both under the names the agent's playbook gave them.
    pi_eds_backend_inputs: "{{ pi_eds_agent_inputs | default(omit) }}"
    pi_eds_backend_source: "{{ pi_eds_agent_source | default('unknown') }}"

    pi_eds_backend_agent_files: "{{ playbook_dir }}/../agent/files"

    # avahi-daemon and mosquitto-clients are in the base already.
    pi_eds_backend_packages:
      - avahi-utils    # avahi-publish, which the agent's pairing uses
      - nftables
      - alsa-utils     # arecord, which is how the turntable driver listens
      - python3-venv   # palette and the recognizer are Python, each kept to itself

    pi_eds_backend_binaries:
      - npagent
      - lightd
      - nowplayd
      - consoled

    # Each service as its own user, with no login and no home.
    pi_eds_backend_users:
      - eds-palette
      - eds-lightd
      - eds-nowplayd
      - eds-console

    pi_eds_backend_units:
      - eds-backend-setup.service
      - eds-backend-dashboards.service
      - eds-palette.service
      - eds-lightd.service
      - eds-nowplayd.service
      - eds-console.service
      - npagent.service

  pre_tasks:
    - name: Assert chroot_root and the inputs directory were given
      ansible.builtin.assert:
        that:
          - chroot_root is defined
          - chroot_root | length > 1
          - pi_eds_backend_inputs is defined
        fail_msg: "chroot_root and pi_eds_agent_inputs must be set by build.sh"

    - name: Look for a mounted root filesystem
      ansible.builtin.stat:
        path: "{{ chroot_root }}/etc/os-release"
      register: pi_eds_backend_osrel

    - name: Fail if the image is not mounted
      ansible.builtin.assert:
        that: pi_eds_backend_osrel.stat.exists
        fail_msg: "No /etc/os-release at {{ chroot_root }}: is the image mounted?"

    - name: Check each staged binary is an arm64 binary
      ansible.builtin.command:
        cmd: "file -b {{ pi_eds_backend_inputs }}/{{ item }}"
      register: pi_eds_backend_file
      changed_when: false
      failed_when: "'ARM aarch64' not in pi_eds_backend_file.stdout"
      loop: "{{ pi_eds_backend_binaries }}"

    # ------------------------------------------------------------
    # Is this the base it has to be?
    # ------------------------------------------------------------
    - name: Look for the take-home image's first-boot unit
      ansible.builtin.stat:
        path: "{{ chroot_root }}/etc/systemd/system/deevnet-kit-firstboot.service"
      register: pi_eds_backend_firstboot

    - name: Fail if the base is not the take-home image
      ansible.builtin.assert:
        that: pi_eds_backend_firstboot.stat.exists
        fail_msg: "No deevnet-kit first-boot unit: this is not Deevnet IoTaaS's pi-backend image"

    # deevnet-kit prints no version. What is asked is whether it can do the
    # two things this card needs of it, by where each shows: keeping a
    # password from a file, in its own help, and taking a hostname from the
    # card, in the settings file that ships beside it. The image published on
    # 2026-09-24 can do neither.
    - name: Ask the image's deevnet-kit what it can do
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /usr/local/bin/deevnet-kit help"
      register: pi_eds_backend_kit_help
      changed_when: false

    - name: Read the settings file the image puts on its boot partition
      ansible.builtin.command:
        cmd: "cat {{ chroot_root }}/boot/deevnet-kit.txt"
      register: pi_eds_backend_kit_txt
      changed_when: false

    - name: Fail if the base's deevnet-kit is too old
      ansible.builtin.assert:
        that:
          - "'--password-file' in pi_eds_backend_kit_help.stdout"
          - "'hostname=' in pi_eds_backend_kit_txt.stdout"
          # 0.12.0: extra names on the certificate, so a card can carry the
          # names and address of the site it is going to (Deevnet CHG-0050).
          - "'deevnet-kit names' in pi_eds_backend_kit_help.stdout"
          # 0.15.0: a certificate from the Tenant Service CA, so the card
          # answers to the tenant's Deevnet names (Deevnet CHG-0056).
          - "'deevnet-kit cert install' in pi_eds_backend_kit_help.stdout"
        fail_msg: >-
          The published pi-backend image carries a deevnet-kit older than
          0.15.0: it cannot keep a password from a file, take a hostname from
          the card, put extra names on the certificate, or install one from
          the Tenant Service CA. Deevnet IoTaaS has
          to restage the kit and rebuild the image first (make stage-pi; make
          pi-backend pi-backend-publish). See ADR-0033.

  tasks:
    # ------------------------------------------------------------
    # Packages
    # ------------------------------------------------------------
    - name: Update apt cache inside chroot
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /usr/bin/apt-get update"
      changed_when: true

    - name: Install the image's packages inside chroot
      ansible.builtin.command:
        cmd: >-
          chroot {{ chroot_root }} /usr/bin/apt-get install -y
          {{ pi_eds_backend_packages | join(' ') }}
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    # ------------------------------------------------------------
    # Users and directories
    # ------------------------------------------------------------
    - name: Create each service's user
      ansible.builtin.command:
        cmd: >-
          chroot {{ chroot_root }} useradd --system --user-group --no-create-home
          --home-dir /nonexistent --shell /usr/sbin/nologin {{ item }}
      register: pi_eds_backend_useradd
      changed_when: pi_eds_backend_useradd.rc == 0
      failed_when: pi_eds_backend_useradd.rc not in [0, 9]  # 9 = exists
      loop: "{{ pi_eds_backend_users }}"

    # The console presents the card's server certificate, and deevnet-kit is
    # the group that may read its key (ADR-0033).
    - name: Let the console read the server certificate's key
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} usermod -aG deevnet-kit eds-console"
      changed_when: true

    # Its own user, with nothing but a directory for its pairing.
    - name: Create the agent's user
      ansible.builtin.command:
        cmd: >-
          chroot {{ chroot_root }} useradd --system --user-group --no-create-home
          --home-dir /var/lib/eds-npagent --shell /usr/sbin/nologin npagent
      register: pi_eds_backend_agent_useradd
      changed_when: pi_eds_backend_agent_useradd.rc == 0
      failed_when: pi_eds_backend_agent_useradd.rc not in [0, 9]  # 9 = exists

    - name: Create the settings directories
      ansible.builtin.file:
        path: "{{ chroot_root }}{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/eds
        - /etc/eds/settings
        - /usr/local/share/eds-palette
        - /usr/local/share/eds-recognize
        - /etc/systemd/system/npagent.service.d

    - name: Create the agent's own directory
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} install -d -o npagent -g npagent -m 0700 /var/lib/eds-npagent"
      changed_when: true

    # ------------------------------------------------------------
    # The services and the agent
    # ------------------------------------------------------------
    - name: Install the binaries
      ansible.builtin.copy:
        src: "{{ pi_eds_backend_inputs }}/{{ item }}"
        dest: "{{ chroot_root }}/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: "{{ pi_eds_backend_binaries }}"

    # The settings that are not secret are the workload's own, deploy/*.env,
    # as they were when the image was built. They are not written twice.
    - name: Install the services' settings
      ansible.builtin.copy:
        src: "{{ pi_eds_backend_inputs }}/settings/{{ item }}.env"
        dest: "{{ chroot_root }}/etc/eds/settings/{{ item }}.env"
        owner: root
        group: root
        mode: "0644"
      loop:
        - lightd
        - nowplayd
        - console

    # The tenant's dashboards, as its Terraform applies them to Deevnet's
    # Grafana; eds-backend-dashboards puts them in this Pi's.
    - name: Install the dashboards
      ansible.builtin.copy:
        src: "{{ pi_eds_backend_inputs }}/dashboards/"
        dest: "{{ chroot_root }}/usr/local/share/eds-dashboards/"
        owner: root
        group: root
        mode: "0644"

    - name: Install what this Pi's console does differently, and the accounts
      ansible.builtin.copy:
        src: "files/{{ item.src }}"
        dest: "{{ chroot_root }}{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: console-pi.settings, dest: /etc/eds/settings/console-pi.env}
        - {src: accounts.conf, dest: /etc/eds/accounts.conf}

    - name: Install the image's own tools
      ansible.builtin.copy:
        src: "files/{{ item.src }}"
        dest: "{{ chroot_root }}{{ item.dest }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - {src: eds-backend-setup, dest: /usr/local/sbin/eds-backend-setup}
        - {src: eds-backend-status, dest: /usr/local/bin/eds-backend-status}
        - {src: eds-backend-palette-install, dest: /usr/local/sbin/eds-backend-palette-install}
        - {src: eds-backend-dashboards, dest: /usr/local/sbin/eds-backend-dashboards}

    - name: Install the agent's tools
      ansible.builtin.copy:
        src: "{{ pi_eds_backend_agent_files }}/{{ item.src }}"
        dest: "{{ chroot_root }}{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {src: eds-agent-pair, dest: /usr/local/bin/eds-agent-pair, mode: "0755"}
        - {src: eds-agent-spotify, dest: /usr/local/bin/eds-agent-spotify, mode: "0755"}
        - {src: eds-recognize, dest: /usr/local/share/eds-recognize/eds-recognize, mode: "0755"}
        - {src: eds-recognize-requirements.txt, dest: /usr/local/share/eds-recognize/eds-recognize-requirements.txt, mode: "0644"}
        - {src: eds-agent-turntable-install, dest: /usr/local/sbin/eds-agent-turntable-install, mode: "0755"}

    # The agent's tools name eds-agent-status as the place to look next. On
    # this Pi that is the backend's.
    - name: Answer to the agent's status tool's name
      ansible.builtin.file:
        src: /usr/local/bin/eds-backend-status
        dest: "{{ chroot_root }}/usr/local/bin/eds-agent-status"
        state: link
        force: true

    # ------------------------------------------------------------
    # palette, and the turntable's recognizer
    # ------------------------------------------------------------
    # Each by the same script a Pi in service is updated with, so an image and
    # a pushed Pi cannot come to differ in it.
    - name: Stage palette's wheel
      ansible.builtin.copy:
        src: "{{ pi_eds_backend_inputs }}/palette/"
        dest: "{{ chroot_root }}/usr/local/share/eds-palette/"
        owner: root
        group: root
        mode: "0644"

    - name: Install palette inside chroot
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /usr/local/sbin/eds-backend-palette-install"
      changed_when: true

    - name: Install the recognizer inside chroot
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /usr/local/sbin/eds-agent-turntable-install"
      changed_when: true

    - name: Clean apt cache inside chroot
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /usr/bin/apt-get clean"
      changed_when: true

    # ------------------------------------------------------------
    # Units and configuration
    # ------------------------------------------------------------
    - name: Install units and configuration
      ansible.builtin.copy:
        src: "files/{{ item.src }}"
        dest: "{{ chroot_root }}{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: eds-backend-setup.service, dest: /etc/systemd/system/eds-backend-setup.service}
        - {src: eds-backend-dashboards.service, dest: /etc/systemd/system/eds-backend-dashboards.service}
        - {src: eds-palette.service, dest: /etc/systemd/system/eds-palette.service}
        - {src: eds-lightd.service, dest: /etc/systemd/system/eds-lightd.service}
        - {src: eds-nowplayd.service, dest: /etc/systemd/system/eds-nowplayd.service}
        - {src: eds-console.service, dest: /etc/systemd/system/eds-console.service}
        - {src: npagent-backend.conf, dest: /etc/systemd/system/npagent.service.d/eds-backend.conf}
        - {src: 90-eds-backend.conf, dest: /etc/sysctl.d/90-eds-backend.conf}
        - {src: mosquitto-eds.conf, dest: /etc/mosquitto/conf.d/eds.conf}

    # Added to the take-home image's greeting, not put in its place: what it
    # says about deevnet-kit is still the place to start.
    - name: Add EdS's lines to the greeting
      ansible.builtin.shell:
        cmd: "cat {{ playbook_dir }}/files/motd >> {{ chroot_root }}/etc/motd"
      changed_when: true

    - name: Install the agent's unit
      ansible.builtin.copy:
        src: "{{ pi_eds_backend_agent_files }}/npagent.service"
        dest: "{{ chroot_root }}/etc/systemd/system/npagent.service"
        owner: root
        group: root
        mode: "0644"

    # ------------------------------------------------------------
    # The firewall
    # ------------------------------------------------------------
    - name: Install the firewall rules
      ansible.builtin.copy:
        src: files/nftables.conf
        dest: "{{ chroot_root }}/etc/nftables.conf"
        owner: root
        group: root
        mode: "0755"

    - name: Find the firewall's unit
      ansible.builtin.stat:
        path: "{{ chroot_root }}/usr/lib/systemd/system/nftables.service"
      register: pi_eds_backend_nft_unit

    - name: Fail if the firewall's unit is missing
      ansible.builtin.assert:
        that: pi_eds_backend_nft_unit.stat.exists
        fail_msg: "nftables.service is not in the image; the Pi would boot with no firewall"

    # nftables.service is wanted by sysinit, not multi-user: the rules are in
    # place before any interface comes up.
    - name: Make sure the sysinit wants directory exists
      ansible.builtin.file:
        path: "{{ chroot_root }}/etc/systemd/system/sysinit.target.wants"
        state: directory
        mode: "0755"

    - name: Enable the firewall
      ansible.builtin.file:
        src: /usr/lib/systemd/system/nftables.service
        dest: "{{ chroot_root }}/etc/systemd/system/sysinit.target.wants/nftables.service"
        state: link
        force: true

    # ------------------------------------------------------------
    # Clock
    # ------------------------------------------------------------
    # UTC, so every service's log lines agree without anyone having to know
    # which summer time the image was built in.
    - name: Set the timezone to UTC
      ansible.builtin.file:
        src: /usr/share/zoneinfo/Etc/UTC
        dest: "{{ chroot_root }}/etc/localtime"
        state: link
        force: true

    - name: Name the timezone
      ansible.builtin.copy:
        dest: "{{ chroot_root }}/etc/timezone"
        content: "Etc/UTC\n"
        mode: "0644"

    # ------------------------------------------------------------
    # Units
    # ------------------------------------------------------------
    - name: Enable the image's units
      ansible.builtin.file:
        src: "/etc/systemd/system/{{ item }}"
        dest: "{{ chroot_root }}/etc/systemd/system/multi-user.target.wants/{{ item }}"
        state: link
        force: true
      loop: "{{ pi_eds_backend_units }}"

    # ------------------------------------------------------------
    # What the card is, and how to finish it
    # ------------------------------------------------------------
    - name: Take each binary's checksum
      ansible.builtin.stat:
        path: "{{ chroot_root }}/usr/local/bin/{{ item }}"
        checksum_algorithm: sha256
      register: pi_eds_backend_sums
      loop: "{{ pi_eds_backend_binaries }}"

    - name: Read what the base says it is
      ansible.builtin.command:
        cmd: "cat {{ chroot_root }}/etc/packer-provisioned"
      register: pi_eds_backend_base
      changed_when: false
      failed_when: false

    - name: Record what this image is
      ansible.builtin.copy:
        dest: "{{ chroot_root }}/etc/eds-backend-release"
        mode: "0644"
        content: |
          Image: eds-pi-backend
          Build Date: {{ ansible_date_time.iso8601 }}
          Source: {{ pi_eds_backend_source }}
          {% for sum in pi_eds_backend_sums.results %}
          {{ sum.item }} sha256: {{ sum.stat.checksum }}
          {% endfor %}
          Base (Deevnet IoTaaS pi-backend):
          {{ pi_eds_backend_base.stdout | default('unknown') | indent(2, first=true) }}

    - name: Leave a note on the boot partition
      ansible.builtin.copy:
        dest: "{{ chroot_root }}/boot/eds-backend.txt"
        mode: "0644"
        content: |
          EdS backend Pi, built {{ ansible_date_time.date }}.

          The whole of EdS on one Pi: Deevnet IoTaaS's take-home image, with
          EdS's services and its now-playing agent added. This card carries no
          secret and no name.

          To finish it, set this card's tenant, name and Wi-Fi in
          deevnet-kit.txt, and create your login with userconf.txt and ssh.
          README.txt, beside this file, says how. The tenant is  eds  and its
          index is  2.

          The EdS repository writes all of it for you: deploy/backend,
          `make card`.

          A folder here called  eds  may hold, for the first boot to take and
          remove:

            discogs.env             NP_DISCOGS_USER= and NP_DISCOGS_TOKEN=
            login, authorized_keys  your user's name, and public keys to admit

    # ------------------------------------------------------------
    # The rules, checked
    # ------------------------------------------------------------
    # The card's secrets are made on its first boot. Any of these in the image
    # is a secret every card flashed from it would share.
    - name: Look for anything secret in the image
      ansible.builtin.shell:
        cmd: >-
          ls -d {{ chroot_root }}/etc/eds/*.env
          {{ chroot_root }}/etc/eds/accounts
          {{ chroot_root }}/etc/deevnet-kit/kit.json
          {{ chroot_root }}/etc/deevnet-kit/tls
          {{ chroot_root }}/etc/mosquitto/deevnet-kit/passwd
          {{ chroot_root }}/var/lib/eds-npagent/itunes-pairing.json
          {{ chroot_root }}/var/lib/eds-npagent/spotify-token.json
          {{ chroot_root }}/boot/eds
          {{ chroot_root }}/boot/userconf.txt 2>/dev/null; true
      register: pi_eds_backend_secrets
      changed_when: false

    - name: Fail if a secret was baked in
      ansible.builtin.assert:
        that: pi_eds_backend_secrets.stdout | length == 0
        fail_msg: "The image holds what must only be made on the card: {{ pi_eds_backend_secrets.stdout_lines }}"

    - name: Read the forwarding setting back
      ansible.builtin.command:
        cmd: "grep -c '^net.ipv4.ip_forward = 0$' {{ chroot_root }}/etc/sysctl.d/90-eds-backend.conf"
      register: pi_eds_backend_forwarding
      changed_when: false

    - name: Read the firewall's forward policy back
      ansible.builtin.shell:
        cmd: "grep -A2 'chain forward' {{ chroot_root }}/etc/nftables.conf | grep -c 'policy drop'"
      register: pi_eds_backend_forward_policy
      changed_when: false

    - name: Fail if the Pi could route
      ansible.builtin.assert:
        that:
          - pi_eds_backend_forwarding.stdout == "1"
          - pi_eds_backend_forward_policy.stdout == "1"
        fail_msg: "Forwarding is not off in both the kernel settings and the firewall"

    # The rules are parsed by the build host's nft, which has to agree they
    # are rules at all. A typo here is a Pi that boots with no firewall.
    - name: Check the firewall rules parse
      ansible.builtin.command:
        cmd: "nft -c -f {{ chroot_root }}/etc/nftables.conf"
      changed_when: false

    # The devices dial the broker, so a firewall that parses and does not
    # admit it is a stand that never lights.
    - name: Check the firewall admits the broker and the console
      ansible.builtin.shell:
        cmd: "grep -E 'tcp dport \\{[^}]*\\}' {{ chroot_root }}/etc/nftables.conf | grep -w 8883 | grep -w -c 443"
      changed_when: false

    - name: Check palette can be imported
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /opt/eds-palette/bin/python -c 'import eds_palette.api'"
      changed_when: false

    # A recognizer that cannot be imported is a turntable driver that is
    # offline on every card.
    - name: Check the recognizer can be imported
      ansible.builtin.command:
        cmd: "chroot {{ chroot_root }} /opt/eds-recognize/bin/python -c 'import shazamio'"
      changed_when: false

    - name: Check the agent may open a sound card
      ansible.builtin.shell:
        cmd: "grep '^audio:' {{ chroot_root }}/etc/group | grep -c -w npagent"
      changed_when: false

    - name: Check the console may read the certificate's key
      ansible.builtin.shell:
        cmd: "grep '^deevnet-kit:' {{ chroot_root }}/etc/group | grep -c -w eds-console"
      changed_when: false

    # The take-home image removes the site's automation user, so that nothing
    # of Deevnet IoTaaS's can reach the card. This image must not put it back.
    - name: Check the automation user is not on the card
      ansible.builtin.shell:
        cmd: "! grep -q '^a_autoprov:' {{ chroot_root }}/etc/passwd"
      changed_when: false
