# The broker accounts of the EdS tenant, for a Pi that is its own broker
# (ADR-0033). eds-backend-setup adds each to the card with deevnet-kit.
#
# THIS IS A COPY. The list is infra/deevnet-tenant-eds/main.tf's, name for
# name and pattern for pattern; `make -C deploy/backend check` reads both and
# fails when they differ. Change that file first, then this one.
#
# Four fields, separated by spaces:
#
#   name   device   publish   subscribe
#
# A device of "-" is a workload account, with no device. Patterns are relative
# to the tenant, as they are in the Terraform, and separated by commas; "-" is
# none.

lightd - lightstand/+/scene,lightd/status lightstand/+/status,lightstand/+/state,nowplaying/current/art,nowplaying/current/look

lp-stand-01 lp-stand-01 lightstand/lp-stand-01/status,lightstand/lp-stand-01/state,log/lp-stand-01,lightstand/lp-stand-01/ota/state lightstand/lp-stand-01/scene,lightstand/lp-stand-01/ota,lightstand/lp-stand-01/ota/chunk

nowplayd - nowplaying/current,nowplaying/current/art,nowplaying/current/look,nowplaying/status,nowplaying/current/art/small,nowplaying/source/+/command nowplaying/source/+/+,nowplaying/command,beacon/turntable-power-01/status,nowplaying/stand

voiced - voiced/status,nowplaying/command,voice/+/heard voice/+/utterance

console - console/status,nowplaying/stand nowplaying/current,nowplaying/current/art,nowplaying/status,nowplaying/source/+/state,nowplaying/source/+/status,lightstand/+/scene,lightstand/+/state,lightstand/+/status,lightd/status,beacon/+/status,screen/+/status,nowplaying/stand

np-relay np-relay nowplaying/source/itunes/state,nowplaying/source/itunes/status,nowplaying/source/itunes/art,nowplaying/source/spotify/state,nowplaying/source/spotify/status,nowplaying/source/spotify/art,nowplaying/source/turntable/state,nowplaying/source/turntable/status,nowplaying/source/turntable/art,log/np-relay nowplaying/source/itunes/command,nowplaying/source/spotify/command

cover-screen-01 cover-screen-01 screen/cover-screen-01/status,nowplaying/command,log/cover-screen-01,screen/cover-screen-01/ota/state nowplaying/current,nowplaying/current/art/small,screen/cover-screen-01/ota,screen/cover-screen-01/ota/chunk

turntable-power-01 turntable-power-01 beacon/turntable-power-01/status,log/turntable-power-01,beacon/turntable-power-01/ota/state beacon/turntable-power-01/ota,beacon/turntable-power-01/ota/chunk

# Updates through the broker (ADR-0035): eds-ota's account, naming each device.
ota - lightstand/lp-stand-01/ota,lightstand/lp-stand-01/ota/chunk,screen/cover-screen-01/ota,screen/cover-screen-01/ota/chunk,beacon/turntable-power-01/ota,beacon/turntable-power-01/ota/chunk lightstand/lp-stand-01/ota/state,screen/cover-screen-01/ota/state,beacon/turntable-power-01/ota/state
