#!/usr/sbin/nft -f
# EdS backend Pi firewall (ADR-0033).
#
# One Pi on one network, and it is the whole back end: what the devices, the
# players and a browser reach is all here. So the rules name ports and no
# interface; the Pi may be on a cable or on Wi-Fi.
#
#   forward   dropped, always. This is not a router. The kernel's forwarding
#             is off as well; this is the second lock on the same door.
#   in        SSH; the broker (8883), which the stand, the screen and the
#             beacon dial; nginx (443, and 80 which only sends people
#             there), which answers for the console and Grafana by name
#             (ADR-0040); the log store (8427), for the tools that read logs;
#             Bonjour, so iTunes can see a remote asking to pair, and the one
#             port it calls back to.
#   not in    palette (8731), lightd's own HTTP (8732), the console (8080)
#             and Grafana (3000). They are for the Pi itself; the last two
#             are reached through nginx.
#   out       open. The agent dials the players and the services it asks.

flush ruleset

table inet eds_backend {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept

        meta l4proto { icmp, ipv6-icmp } accept

        tcp dport { 22, 80, 443, 8427, 8883 } accept

        udp dport 5353 accept
        tcp dport 3690 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
