# nginx on a backend Pi: the one thing a browser reaches (ADR-0040).
#
# A person types a name and nothing after it. nginx holds 80 and 443 and
# presents the card's one server certificate; Grafana and the console are
# behind it on loopback, and neither is reached any other way.
#
#   grafana.<anything>   Grafana, which deevnet-kit serves on 127.0.0.1:3000
#   any other name       the console, plain HTTP on 127.0.0.1:8080
#
# No name of a site is written here: an image carries none. Which names the
# certificate holds is the card's (names=, `deevnet-kit names`). After
# `deevnet-kit regen-certs`, `systemctl reload nginx` to present the new one.

# Grafana Live's WebSocket asks to upgrade; nothing else does.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ~^grafana\.;

    ssl_certificate     /etc/deevnet-kit/tls/server.pem;
    ssl_certificate_key /etc/deevnet-kit/tls/server-key.pem;

    location / {
        # Grafana serves HTTPS with the same certificate, on loopback; the
        # hop is the Pi's own, so it is not verified a second time.
        proxy_pass https://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Grafana Live is a WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl default_server;

    ssl_certificate     /etc/deevnet-kit/tls/server.pem;
    ssl_certificate_key /etc/deevnet-kit/tls/server-key.pem;

    # What the console says itself when it serves TLS: a day, this name only.
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The page is kept current by server-sent events (api/events): each
        # one is passed on as it is written, and a quiet stream is not cut.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
