#!/usr/sbin/nft -f
# EdS agent Pi firewall.
#
# The same rules serve a card with one leg and a card with two. A relay has a
# leg on two networks that are otherwise kept apart: the Deevnet site on eth0,
# and the network its players are on, on wlan0. It exists to carry one kind of
# fact from one to the other - what is playing - and that crossing happens
# inside the agent, as an MQTT publish. Nothing crosses at the network layer.
# On a card with no second leg the wlan0 rules match nothing.
#
#   forward   dropped, always. This is not a router. The kernel's forwarding
#             is off as well; this is the second lock on the same door.
#   eth0      SSH in. It is how the site's automation reaches the Pi.
#   wlan0     Bonjour, so iTunes can see a remote asking to pair, and the one
#             port iTunes calls back to when the code is typed. No SSH: the
#             second network is not a place this Pi is administered from.
#   out       open. The agent dials the broker on eth0 and the players on
#             wlan0, and both are outbound.

flush ruleset

table inet eds_agent {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept

        meta l4proto { icmp, ipv6-icmp } accept

        iifname "eth0" tcp dport 22 accept

        iifname "wlan0" udp dport 5353 accept
        iifname "wlan0" tcp dport 3690 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
