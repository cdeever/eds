# Who can read what is in secrets/ (ADR-0037, ADR-0052): one age recipient,
# the owner's key, whose private half is in the Mac's Keychain and on paper.
# A second machine is a second recipient here, not a copy of the key.
#
# new-key.sh writes the public key in place of the line below, once.
creation_rules:
  - path_regex: \.sops\.(json|env|conf)$
    age: age123ajx5umaewkrsyngz0hh20rrry0me9pyxfmv5u090kvjcyr4qgq3fvele
